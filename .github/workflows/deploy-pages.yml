name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter web build output
        run: |
          test -f .nojekyll || touch .nojekyll
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f main.dart.js || (echo "Missing main.dart.js" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id')"
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "github-pages artifact not found"
            exit 1
          fi
          gh api --method POST "repos/${{ github.repository }}/pages/deployments" \
            -f artifact_id="$ARTIFACT_ID" \
            --jq '.page.url' | tee page_url.txt
          echo "page_url=$(cat page_url.txt)" >> "$GITHUB_OUTPUT"
