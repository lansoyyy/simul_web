name: Deploy GitHub Pages

# Fallback workflow using only actions/checkout (other actions/* downloads fail on this repo).
# Primary deploy path: deploy_web.sh pushes the gh-pages branch directly.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish site to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-deploy
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f origin HEAD:gh-pages
