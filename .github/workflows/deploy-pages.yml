name: Deploy GitHub Pages

# Deploy pre-built Flutter web static files (no Jekyll).
# Requires repo Settings → Pages → Source: "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter web build output
        run: |
          test -f .nojekyll || touch .nojekyll
          test -f index.html || (echo "Missing index.html — push a Flutter web build first." && exit 1)
          test -f main.dart.js || (echo "Missing main.dart.js — push a Flutter web build first." && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
